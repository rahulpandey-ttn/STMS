<sly data-sly-use.form="com.ttn.stms.core.tickets.models.TicketCreateModel"
     data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html"/>

<sly data-sly-call="${clientlib.css @ categories='stms.components.ticketcreate'}"/>

<section class="cmp-ticketcreate" data-cmp-is="ticketcreate">
    <div class="stms-page-head cmp-ticketcreate__page-head">
        <div>
            <h1 class="stms-page-head__title">Create support ticket</h1>
            <p class="stms-page-head__subtitle">Submit a new request for the support team</p>
        </div>
        <a class="stms-btn stms-btn--secondary"
           data-sly-test="${form.hasListPage}"
           href="${form.listPage @ extension='html'}">Cancel</a>
    </div>

    <p class="stms-alert stms-alert--error" data-sly-test="${form.hasError}" role="alert">${form.errorMessage}</p>

    <div class="stms-panel cmp-ticketcreate__form-panel">
        <div class="stms-panel__head-left cmp-ticketcreate__form-panel-head">
            <span class="stms-panel__icon" aria-hidden="true">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
            </span>
            <h2 class="stms-panel__title">Ticket details</h2>
        </div>

        <form class="stms-panel__body cmp-ticketcreate__form"
              method="post"
              action="${form.formAction}"
              novalidate="novalidate">
            <input type="hidden" name=":cq_csrf_token" value=""/>
            <input type="hidden" name="formPage" value="${currentPage.path}"/>
            <input type="hidden" name="detailPage" value="${form.detailPage}"/>

            <div class="cmp-ticketcreate__fields">
                <div class="stms-field">
                    <label class="stms-field__label" for="${resource.path @ context='attribute'}-title">
                        Title <span class="stms-field__required">*</span>
                    </label>
                    <input class="stms-field__input"
                           type="text"
                           id="${resource.path @ context='attribute'}-title"
                           name="title"
                           value="${form.titleValue}"
                           maxlength="200"
                           placeholder="Brief summary of the issue"
                           aria-required="true"
                           aria-describedby="${resource.path @ context='attribute'}-title-error"/>
                    <p class="stms-field__error"
                       id="${resource.path @ context='attribute'}-title-error"
                       role="alert"
                       hidden="hidden"></p>
                </div>

                <div class="stms-field">
                    <label class="stms-field__label" for="${resource.path @ context='attribute'}-description">
                        Description <span class="stms-field__required">*</span>
                    </label>
                    <textarea class="stms-field__textarea"
                              id="${resource.path @ context='attribute'}-description"
                              name="description"
                              rows="6"
                              placeholder="Describe the issue in detail"
                              aria-required="true"
                              aria-describedby="${resource.path @ context='attribute'}-description-error">${form.descriptionValue}</textarea>
                    <p class="stms-field__error"
                       id="${resource.path @ context='attribute'}-description-error"
                       role="alert"
                       hidden="hidden"></p>
                </div>

                <div class="cmp-ticketcreate__fields-row">
                    <div class="stms-field">
                        <label class="stms-field__label" for="${resource.path @ context='attribute'}-priority">
                            Priority <span class="stms-field__required">*</span>
                        </label>
                        <select class="stms-field__select"
                                id="${resource.path @ context='attribute'}-priority"
                                name="priority"
                                aria-required="true"
                                aria-describedby="${resource.path @ context='attribute'}-priority-error">
                            <option data-sly-repeat.option="${form.priorityOptions}"
                                    value="${option.value}"
                                    selected="${option.value == form.priorityValue}">${option.label}</option>
                        </select>
                        <p class="stms-field__error"
                           id="${resource.path @ context='attribute'}-priority-error"
                           role="alert"
                           hidden="hidden"></p>
                    </div>

                    <div class="stms-field">
                        <label class="stms-field__label" for="${resource.path @ context='attribute'}-assignee">Assignee</label>
                        <input class="stms-field__input"
                               type="email"
                               id="${resource.path @ context='attribute'}-assignee"
                               name="assignee"
                               value="${form.assigneeValue}"
                               placeholder="e.g. user@example.com"
                               aria-describedby="${resource.path @ context='attribute'}-assignee-error"/>
                        <p class="stms-field__error"
                           id="${resource.path @ context='attribute'}-assignee-error"
                           role="alert"
                           hidden="hidden"></p>
                    </div>
                </div>
            </div>

            <div class="stms-form-actions">
                <button class="stms-btn stms-btn--primary" type="submit">Submit ticket</button>
                <a class="stms-btn stms-btn--secondary"
                   data-sly-test="${form.hasListPage}"
                   href="${form.listPage @ extension='html'}">Cancel</a>
            </div>
        </form>
    </div>
</section>

<sly data-sly-call="${clientlib.js @ categories='stms.components.ticketcreate'}"/>
